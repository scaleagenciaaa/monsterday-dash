name: Refresh MonsterDay (3h)

on:
  schedule:
    - cron: '17,47 * * * *'   # 25/11/2026: a cada 30 min (pedido do cliente), minuto proprio
  workflow_dispatch:          # gatilho confiável = cron-job.org faz POST aqui

permissions:
  contents: write

concurrency:
  group: monsterday-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js (leads x queries + leadscore)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Mode all
      - name: Commit data.js se mudou
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if (git status --porcelain data.js) {
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git pull --rebase origin main
            git push
          } else { Write-Host "sem mudancas" }
